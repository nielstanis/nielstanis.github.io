<head>
  <link href="http://gmpg.org/xfn/11" rel="profile">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="content-type" content="text/html; charset=utf-8">

  <!-- Enable responsiveness on mobile devices-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

  <title>
    {% if page.title == "Home" %}
      {{ site.title }} &middot; {{ site.tagline }}
    {% else %}
      {{ page.title }} &middot; {{ site.title }}
    {% endif %}
  </title>

  <!-- Theme: stored choice, else OS preference (set before paint to avoid a flash) -->
  <script>
    (function () {
      var root = document.documentElement, stored = null;
      try { stored = localStorage.getItem("theme"); } catch (e) {}
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      root.setAttribute("data-theme", stored || (mq.matches ? "dark" : "light"));
      mq.addEventListener && mq.addEventListener("change", function (e) {
        var s = null;
        try { s = localStorage.getItem("theme"); } catch (x) {}
        if (!s) root.setAttribute("data-theme", e.matches ? "dark" : "light");
      });
    })();
  </script>

  <!-- CSS -->
  <link rel="stylesheet" href="/public/css/poole.css">
  <link rel="stylesheet" href="/public/css/syntax.css">
  <link rel="stylesheet" href="/public/css/hyde.css">
  <link rel="stylesheet" href="/public/css/fennec.css">
  <link rel="stylesheet" href="/public/css/dark.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;700&family=Abril+Fatface&display=swap">

  <!-- Icons -->
  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="/public/apple-touch-icon-144-precomposed.png">
                                 <link rel="shortcut icon" href="/public/favicon.ico">

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="RSS" href="/atom.xml">
</head>
