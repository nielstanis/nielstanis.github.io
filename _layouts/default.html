<!DOCTYPE html>
<html lang="en-us">

  {% include head.html %}

  <body class="layout-reverse">

    {% include sidebar.html %}

    <div class="content container">
      {{ content }}
    </div>

    <script>
      document.getElementById("theme-toggle").addEventListener("click", function () {
        var root = document.documentElement;
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        root.classList.add("theme-transition");
        setTimeout(function () { root.classList.remove("theme-transition"); }, 450);
        try { localStorage.setItem("theme", next); } catch (e) {}
      });
    </script>

    <style>
      .code-wrap { position: relative; }
      .copy-btn {
        position: absolute; top: .35rem; right: .35rem; z-index: 1;
        width: 1.8rem; height: 1.8rem; padding: 0; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        color: inherit; background: transparent; border: 1px solid rgba(128,128,128,.4);
        border-radius: 4px; opacity: .5; transition: opacity .15s;
      }
      .code-wrap:hover .copy-btn, .copy-btn:focus { opacity: 1; }
      .copy-btn svg { width: 1rem; height: 1rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .code-wrap pre { padding-right: 2.8rem; }
    </style>
    <script>
      (function () {
        var copyIcon = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
        var checkIcon = '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
        document.querySelectorAll(".post pre").forEach(function (pre) {
          var host = pre.closest(".highlight") || pre;
          if (host.parentNode.classList.contains("code-wrap")) return;
          var wrap = document.createElement("div");
          wrap.className = "code-wrap";
          host.parentNode.insertBefore(wrap, host);
          wrap.appendChild(host);
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "copy-btn";
          btn.title = "Copy code";
          btn.setAttribute("aria-label", "Copy code");
          btn.innerHTML = copyIcon;
          btn.addEventListener("click", function () {
            var text = (pre.querySelector("code") || pre).innerText;
            var done = function () {
              btn.innerHTML = checkIcon;
              setTimeout(function () { btn.innerHTML = copyIcon; }, 1500);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text).then(done);
            } else {
              var ta = document.createElement("textarea");
              ta.value = text; document.body.appendChild(ta); ta.select();
              try { document.execCommand("copy"); done(); } catch (e) {}
              document.body.removeChild(ta);
            }
          });
          wrap.appendChild(btn);
        });
      })();
    </script>

  </body>
</html>
